<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player Zone - Cadastro</title>
  <!-- Favicon com logo -->
  <link rel="icon" href="logo player zone.png" type="image/png" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- External CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="cadastro-container">
    <div class="header">
      <img src="logo player zone.png" alt="Logo Player Zone" class="logo" />
      <h2>Player Zone</h2>
    </div>
    <p class="subtitulo">Cadastre-se gratuitamente e junte-se à comunidade</p>

    <!-- Success Message -->
    <div id="success-message" class="success-message hidden">
      <i class="fas fa-check-circle"></i> Cadastro realizado com sucesso! Redirecionando...
    </div>

    <!-- FORMULÁRIO COM POST -->
    <form id="cadastro-form" method="post" action="#">
      <div class="form-group">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="Seu nome" required />
      </div>

      <div class="form-group">
        <label for="sobrenome">Sobrenome</label>
        <input type="text" id="sobrenome" name="sobrenome" placeholder="Seu sobrenome" required />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required />
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha (mín. 8 caracteres)" required />
        <div id="password-strength" class="password-strength"></div>
      </div>

      <div class="form-group">
        <label for="data-nascimento">Data de Nascimento</label>
        <input type="date" id="data-nascimento" name="data-nascimento" required />
      </div>

      <div class="form-group">
        <label for="telefone">Número de Telefone</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(99) 99999-9999" required />
      </div>

      <div class="form-group">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required />
      </div>

      <button type="submit" id="submit-btn">
        <span class="btn-text">Cadastrar</span>
        <span class="spinner hidden"></span>
      </button>
      <button type="button" class="botao-login" onclick="window.location.href='../index.html'">Já tem uma conta? Faça login</button>
    </form>

    <div class="social-login">
      <strong>Ou continue com</strong>
      <div class="social-buttons">
        <div class="social-button social-google" title="Login com Google" onclick="alert('Funcionalidade em desenvolvimento')">
          <img src="https://cdn-icons-png.flaticon.com/512/281/281764.png" alt="Google" />
        </div>
        <div class="social-button social-twitter" title="Login com Twitter" onclick="alert('Funcionalidade em desenvolvimento')">
          <img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter" />
        </div>
        <div class="social-button social-facebook" title="Login com Facebook" onclick="alert('Funcionalidade em desenvolvimento')">
          <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook" />
        </div>
      </div>
    </div>
  </div>

  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <!-- JavaScript -->
  <script src="script.js"></script>

</body>
</html>
